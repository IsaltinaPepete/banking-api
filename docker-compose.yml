services:
  postgres:
    image: postgres:17
    container_name: banking-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    networks:
      - banking-network

networks:
  banking-network:
    driver: bridge